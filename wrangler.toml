name = "slams"
main = "./.output/server/index.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e543b6a0521fc8fd76447ceba097b665"

# Static assets built by Vite, served by Nitro's cloudflare_module worker.
assets = { directory = "./.output/public", binding = "ASSETS" }

# Cloudflare D1 database. Create it once with:
#   wrangler d1 create slams
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "slams"
database_id = "7ba50733-1f70-48ea-8d30-8c450e963c31"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
